<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio: Today</title>
<style>
:root{--bg:#1a0a0b;--card:#2b1013;--ink:#f3e9d8;--mute:#b8a894;--line:#4a2a2c;--acc:#f4b02e;--ok:#7fc59a;--todo:#f4b02e}
@media(prefers-color-scheme:light){:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--mute:#7a756a;--line:#e4dfd3;--acc:#b8642a;--ok:#2f7d4f;--todo:#b8642a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 18px}h1{font-size:19px;margin:0;font-weight:700}
.grow{flex:1}a{color:var(--acc)}
.strip{max-width:920px;margin:18px auto 0;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.strip .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}.strip b{font-size:15px}
.pbar{height:14px;border-radius:7px;background:rgba(0,0,0,.25);border:1px solid var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#b8642a,#f4b02e);transition:width 1s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.act{border-color:var(--acc);color:var(--acc)}.chip.full{border-color:var(--ok);color:var(--ok)}
main{max-width:920px;margin:18px auto;padding:0 18px;display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.item.todo{border-left:5px solid var(--todo)}.item.ok{opacity:.7}.item h2{font-size:16px;margin:0}.item p{margin:0;color:var(--mute);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}button.act{background:var(--acc);color:#1a0a0b;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
a.act{background:var(--acc);color:#1a0a0b;border-radius:10px;padding:8px 14px;font-weight:600;text-decoration:none}button.act:disabled{opacity:.5}.badge{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--line)}
.head{display:flex;align-items:center;gap:10px}.msg{color:var(--ok);font-size:13px}
</style></head><body>
<!--NAV-->
<header><h1>Today</h1><span class="badge" id="open">…</span></header>
<section class="strip"><div class="top"><b id="sline">No run yet</b><span class="grow"></span><a href="/live">Open mission control →</a></div>
<div class="pbar"><i id="sbar" style="width:0"></i></div><div class="chips" id="schips"></div></section>
<main id="list"><div class="item"><p>Loading…</p></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n||0);
async function strip(){const t=await (await fetch('/api/telemetry')).json();
 $('sline').textContent=!t.run?'No run yet':t.running?`Run working: ${t.percent.toFixed(0)}% · ${t.ideas_done} of ${t.ideas} ideas · ${k(t.tokens)} tokens`:`Last run: ${t.status} · ${t.ideas_done} of ${t.ideas} ideas · ${k(t.tokens)} tokens`;
 $('sbar').style.width=t.percent+'%';
 $('schips').innerHTML=t.stages.map(s=>`<span class="chip ${s.active?'act':s.done===s.total&&s.total?'full':''}">${s.label} ${s.done}/${s.total}${s.active?' · '+s.active+' working':''}</span>`).join('')}
async function act(a,btn){if(a.confirm&&!confirm(a.confirm))return;btn.disabled=true;
 const body=a.body?JSON.stringify(a.body):undefined;const r=await fetch(a.api,{method:'POST',headers:{'Content-Type':'application/json'},body});
 const j=await r.json().catch(()=>({}));$('open').textContent=r.ok?(j.message||'done'):(j.detail||'failed');setTimeout(load,1200)}
async function load(){const t=await (await fetch('/api/today')).json();
 $('open').textContent=t.open?`${t.open} for you`:'all clear';
 $('list').innerHTML=t.items.map((i,k)=>`<div class="item ${i.level}"><div class="head"><h2>${esc(i.title)}</h2></div><p>${esc(i.detail)}</p>${i.actions.length?`<div class="row">${i.actions.map((a,j)=>a.href?`<a class="act" href="${esc(a.href)}">${esc(a.label)}</a>`:`<button class="act" data-i="${k}" data-j="${j}">${esc(a.label)}</button>`).join('')}</div>`:''}</div>`).join('');
 document.querySelectorAll('button.act').forEach(b=>b.onclick=()=>act(t.items[b.dataset.i].actions[b.dataset.j],b))}
load();strip();setInterval(load,15000);setInterval(strip,4000);
</script></body></html>
