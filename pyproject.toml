[project]
name = "dk-intelligence"
version = "0.1.0"
description = "Dhaka Kacchi intelligence: models trained on the Mac, served and measured on the VPS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=23.0.1,<24",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "scikit-learn==1.9.1",
    "typer>=0.15,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
intel = "intel.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
    "types-pyyaml>=6.0.12.20260906",
]
train = ["mlflow>=3,<4"]          # Mac only; the VPS image installs without it

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S608"]   # asserts in tests; ssh subprocess with fixed args; SQL built with psycopg.sql

[tool.ruff.lint.per-file-ignores]
"src/intel/serve/app.py" = ["E501"]   # inline HTML/CSS templates
"src/intel/serve/views.py" = ["E501"]
"src/intel/control.py" = ["E501"]
"src/intel/models/creator_matcher/run.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.Query", "typer.Option", "typer.Argument"]

# ---------- type checking (ADR 0010: gradual typing with a ratchet) ----------
# The whole package passes mypy's default checks; modules listed under STRICT also pass --strict. The list only grows:
# a module joins it when it is touched and brought up to standard. CI runs `mypy` (this config).
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true          # sklearn, joblib, pyarrow, mlflow ship no type information
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]   # STRICT: the MLOps core
module = [
    "intel.plugins",
    "intel.pipeline",
    "intel.settings",
    "intel.tunnel",
    "intel.datasets.content",
    "intel.judge",
    "intel.evaluate",
    "intel.package",
    "intel.data",
    "intel.pull",
    "intel.market",
    "intel.weekly",
    "intel.serve.db",
    "intel.serve.runs",
]
# --strict, spelled out: a per-module `strict = true` is applied to every module by mypy
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
extra_checks = true

[[tool.mypy.overrides]]   # TYPING DEBT, sealed model code (ADR 0011): fixed together with the next real model change
module = [
    "intel.champions.harness_v1.features",          # vendored from the harness, pinned by hash: never edited here
    "intel.models.content_scorer.features",
    "intel.models.community_map.run",
    "intel.models.creator_matcher.run",
    "intel.models.funnel.run",
    "intel.models.occasion_planner.run",
    "intel.models.weakness_miner.mine",
]
ignore_errors = true

# ---------- coverage (ADR 0010) ----------
[tool.coverage.run]
source = ["intel"]
branch = true
omit = ["src/intel/cli.py"]           # thin typer wrapper; its commands are tested through the functions they call

[tool.coverage.report]
precision = 2                         # compare unrounded: with 0 decimals, 75.99% passed a 76% floor
fail_under = 76                       # the floor only moves up (2026-10-08: 76.7% branch coverage; docs/QUALITY.md)
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]
