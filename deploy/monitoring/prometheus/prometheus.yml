global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {site: dk-vps}

rule_files: [/etc/prometheus/rules/*.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: intel-api
    static_configs: [{targets: ["intel-api:8000"]}]

  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]

  # The SLO's ground truth: an outside-in probe of /health/deep (database + a real prediction, no ledger writes).
  - job_name: blackbox-deep
    metrics_path: /probe
    params: {module: [http_deep]}
    static_configs: [{targets: ["http://intel-api:8000/health/deep"]}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}

  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
