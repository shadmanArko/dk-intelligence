# The content plan: how much one run plans. Change a line, run again. Every key is read by src/intel/studio/config.py.

horizon_days: 5           # days one run plans (5 days x 3 ideas = 15 ideas): fewer videos kept on the disks (ADR 0042)
first_day_offset: 1       # 1 = the plan starts tomorrow; 0 = today (only slots 60 s or more away can be handed over)
ideas_per_day: 3          # ideas per day (at most 3: one per posting window, see slots.yaml)
max_ideas_per_run: 30     # a hard cap on ideas in one run, whatever the two lines above say
chunk_ideas: 10           # the strategist plans this many ideas per call (about 3 days), so its context stays small

# One idea becomes one native post per platform below (its own caption and options), from ONE master render.
platforms: [instagram, facebook, tiktok, youtube, threads]
primary_platform: instagram   # the platform whose content scorer and grounding pack plan an idea

# The format of idea 1, 2, 3 of each day. reel = a 9:16 video for all five platforms. carousel = slides for Instagram
# and Facebook only (2 posts); image = one picture for Instagram, Facebook and Threads (3 posts). TikTok and YouTube
# post video only (routes.yaml), so every non-reel idea makes fewer than 5 posts. All reels = 150 posts per 10 days.
format_mix: [reel, reel, reel]    # used when format_rotation below is empty

# Different surfaces on different days, so the feed does not look the same every day (one row per day, three formats per
# row, then it repeats). Idea 1 and 2 are the videos that reach everyone; idea 3 rotates the surface:
#   carousel = slides for Instagram and Facebook · image = one picture for Instagram, Facebook, Threads
#   story = one 9:16 picture for Instagram Stories · landscape = 16:9 video for YouTube and Facebook
format_rotation:
  - [reel, reel, carousel]
  - [reel, reel, story]
  - [reel, reel, image]
  - [reel, reel, landscape]

# What the ideas are about. The strategist tags each idea with one pillar; no pillar may take more than max_pillar_share
# of a run (code checks this and tells the strategist the counts so far).
max_pillar_share: 0.4
pillars:
  - {name: food, about: "the food itself: the pot, the rice, the meat, the box; close-ups and the moment of opening"}
  - {name: berlin, about: "Berlin: the areas we deliver to, the Saturday ritual of picking up, neighbours"}
  - {name: guests, about: "what guests say, answering a real need from a review (never copy a quote)"}
  - {name: order, about: "how to order for Saturday: the deadline and channels, only as the facts say"}
  - {name: occasions, about: "festive days in the next 10 days, in the right tone (sales_ok only where allowed)"}
