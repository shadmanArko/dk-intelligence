# Running without you. `uv run intel studio schedule install` puts a daily check on this Mac (launchd); the studio only
# does real work when the calendar needs filling. Nothing here ever approves or posts: every run makes DRAFTS.

enabled: true
run_at: "03:30"          # the daily check, Mac local time (the Mac must be on; the studio keeps it awake while it works)
publish: drafts          # drafts | dry-run | render
lead_days: 4             # run when the last planned slot in the publisher's calendar is fewer than this many days ahead
min_days_between: 6      # never run twice within this many days
max_awaiting: 40         # skip when this many drafts already wait for your approval (do not pile up a backlog)
notify: true             # a macOS notification and a summary file when a scheduled run finishes, fails or nears the budget
