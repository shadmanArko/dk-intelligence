# Decisions that wait for YOU. They show on the Today page until you delete the line (or set done: true).
# Plain words; nothing here is read by the studio itself.

decisions:
  - id: rotation
    title: "All reels, or a mix of surfaces?"
    detail: "Decided 2026-10-13: keep the mix (about 124 posts per 10 days). Set format_rotation: [] in config/studio/plan.yaml only if you ever want all reels."
    done: true
  - id: facts
    title: "Confirm two menu facts"
    detail: "Decided 2026-10-13: regular box 15, taster box 10, borhani 6 (all incl. VAT), no lamb, chutney free with the regular box only. In facts.yaml (data-platform PR 5); the Mac's active pack has it."
    done: true
  - id: telegram
    title: "A Telegram message from the Mac?"
    detail: "Decided 2026-10-13: skip. You get a Mac notification and the VPS's morning digest and TikTok cards on Telegram."
    done: true
  - id: tiktok
    title: "TikTok privacy"
    detail: "Decided 2026-10-13: nothing to change now. TikTok runs as assisted posting (a Telegram card with the video, caption and settings; the owner posts by hand) and works well. When the TikTok API is approved, revisit this: privacy_level in config/studio/routes.yaml (only_me or public)."
    done: true
