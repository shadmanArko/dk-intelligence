name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:     # "Run workflow" button: test + deploy without a new commit

permissions:
  contents: read   # least privilege: the workflow only reads the code

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine          # same major version as the VPS warehouse
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEL_TEST_PG_DSN: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the secret scan
      # Secret scan of the WHOLE git history (the pre-commit hook only sees staged changes, so it guards commits).
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --no-banner
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # The same hooks as on the laptop: lint, format, mypy (strict core), file hygiene, sealed-code lock.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      # Tests + branch coverage; fails below the floor in pyproject.toml ([tool.coverage.report] fail_under).
      - run: uv run pytest -rs --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # Door 3: after the tests pass on main, trigger the VPS deploy over a forced-command key that can ONLY run
  # /opt/dhaka-kacchi/bin/run-intel-deploy.sh (git pull --ff-only + deploy/deploy.sh). The `script` below is
  # ignored by the server; it only exists because the action requires one. Skips until the secrets are set.
  deploy:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-intel
    steps:
      - id: check
        env:
          KEY: ${{ secrets.INTEL_VPS_SSH_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::INTEL_VPS_* secrets not set, deploy skipped"; fi
      - if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.INTEL_VPS_HOST }}
          username: ${{ secrets.INTEL_VPS_USER }}
          key: ${{ secrets.INTEL_VPS_SSH_KEY }}
          command_timeout: 20m
          script: echo "triggering dk-intelligence deploy"
